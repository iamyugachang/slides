<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yuga Slides</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07111f;
      --bg-deep: #050911;
      --panel: #101a26;
      --panel-strong: #152235;
      --ink: #f4efe4;
      --muted: #9fb2c7;
      --cyan: #60d8f6;
      --amber: #f4b23d;
      --line: #2b3b4e;
      --shadow: #000b;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(circle at 16% 12%, #17324a 0, transparent 36%),
        radial-gradient(circle at 84% 18%, #f4b23d1a 0, transparent 30%),
        radial-gradient(circle at 18% 84%, #60d8f61a 0, transparent 34%),
        linear-gradient(135deg, var(--bg), var(--bg-deep) 66%, #03060d);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      line-height: 1.5;
    }

    a {
      color: inherit;
    }

    .page {
      width: min(100%, 1120px);
      min-height: 100vh;
      margin: 0 auto;
      padding: clamp(32px, 7vw, 88px) clamp(20px, 5vw, 48px);
      display: grid;
      align-content: center;
      gap: clamp(32px, 6vw, 64px);
    }

    .hero {
      max-width: 760px;
    }

    .eyebrow {
      margin: 0 0 16px;
      color: var(--amber);
      font-size: clamp(0.82rem, 2.2vw, 0.95rem);
      font-weight: 900;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(3rem, 10vw, 6.5rem);
      line-height: 0.96;
      letter-spacing: -0.055em;
      font-weight: 950;
    }

    .description {
      max-width: 640px;
      margin: clamp(18px, 3vw, 28px) 0 0;
      color: var(--muted);
      font-size: clamp(1.05rem, 2.5vw, 1.45rem);
    }

    .archive {
      display: grid;
      gap: 18px;
    }

    .archive-title {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .deck-card {
      position: relative;
      display: block;
      overflow: hidden;
      border: 1px solid #ffffff14;
      border-radius: 28px;
      padding: clamp(24px, 5vw, 42px);
      background:
        radial-gradient(circle at 86% 18%, #f4b23d24, transparent 30%),
        radial-gradient(circle at 14% 84%, #60d8f61d, transparent 32%),
        linear-gradient(135deg, #101a26, #0b1420 62%, #111827);
      box-shadow: 0 28px 90px var(--shadow), inset 0 1px 0 #ffffff12;
      text-decoration: none;
      transition: transform 180ms ease, border-color 180ms ease, box-shadow 180ms ease, background 180ms ease;
    }

    .deck-card::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      background: linear-gradient(120deg, #ffffff12, transparent 34%, #ffffff08);
      opacity: 0.72;
    }

    .deck-card:hover,
    .deck-card:focus-visible {
      transform: translateY(-4px);
      border-color: #f4b23d88;
      box-shadow: 0 34px 110px #000d, 0 0 0 4px #f4b23d22, inset 0 1px 0 #ffffff18;
    }

    .deck-card:focus-visible {
      outline: 3px solid var(--cyan);
      outline-offset: 5px;
    }

    .deck-card > * {
      position: relative;
      z-index: 1;
    }

    .deck-meta {
      margin: 0 0 18px;
      color: var(--cyan);
      font-size: clamp(0.88rem, 2.1vw, 1rem);
      font-weight: 900;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .deck-title {
      margin: 0;
      font-size: clamp(2rem, 7vw, 4.25rem);
      line-height: 1.04;
      letter-spacing: -0.045em;
      font-weight: 950;
    }

    .deck-summary {
      margin: 18px 0 0;
      color: var(--muted);
      font-size: clamp(1.05rem, 2.7vw, 1.45rem);
    }

    .deck-summary strong {
      color: var(--amber);
      font-weight: 900;
    }

    .card-action {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: clamp(24px, 5vw, 38px);
      color: #ffe0a3;
      font-size: 1rem;
      font-weight: 850;
    }

    .card-action::after {
      content: "→";
      color: var(--amber);
      font-size: 1.25em;
      line-height: 1;
    }

    @media (max-width: 620px) {
      .page {
        align-content: start;
      }

      .deck-card {
        border-radius: 22px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition: none !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="hero" aria-labelledby="page-title">
      <p class="eyebrow">Slides Archive</p>
      <h1 id="page-title">Yuga Slides</h1>
      <p class="description">收錄以系統思維整理的簡報與技術敘事，方便回看、分享與延伸。</p>
    </header>

    <section class="archive" aria-labelledby="archive-title">
      <h2 class="archive-title" id="archive-title">Collection</h2>
      <a class="deck-card" href="./llm-capability-evolution/" aria-label="開啟 LLM 能力演進簡報，12 slides">
        <p class="deck-meta">01 · AI SYSTEMS</p>
        <h3 class="deck-title">LLM 能力演進</h3>
        <p class="deck-summary">文字接龍 → <strong>Loop engineering</strong> · 12 slides</p>
        <span class="card-action" aria-hidden="true">開啟簡報</span>
      </a>
      <a class="deck-card" href="./career-portfolio/" aria-label="Open Yuga Chang career portfolio, 9 slides">
        <p class="deck-meta">02 · CAREER PORTFOLIO</p>
        <h3 class="deck-title">Data &amp; AI, End to End</h3>
        <p class="deck-summary">Computer vision → recommendation → <strong>AI platforms</strong> · 9 slides</p>
        <span class="card-action" aria-hidden="true">Open deck</span>
      </a>
    </section>
  </main>
</body>
</html>
