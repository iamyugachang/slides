<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500"><rect width="1120" height="500" fill="#f8fafc"/><rect x="20" y="20" width="64" height="24" rx="6" fill="#7c3aed"/><text x="52" y="37" font-size="13" fill="#fff" font-weight="bold" text-anchor="middle" font-family="'Noto Sans CJK TC','Helvetica Neue','PingFang TC','Microsoft JhengHei',Arial,sans-serif">DEMO</text><text x="104" y="40" font-size="24" fill="#111" font-weight="bold" text-anchor="start" font-family="'Noto Sans CJK TC','Helvetica Neue','PingFang TC','Microsoft JhengHei',Arial,sans-serif">Policy as Code</text><text x="20" y="76" font-size="16" fill="#334155" text-anchor="start" font-family="'Noto Sans CJK TC','Helvetica Neue','PingFang TC','Microsoft JhengHei',Arial,sans-serif">default-deny 正面表列 + <tspan fill="#dc2626" font-weight="bold">ABAC 三態決策 (allow / deny / require_approval)</tspan></text><line x1="20" y1="96" x2="1100" y2="96" stroke="#00000022" stroke-width="1"/><rect x="30" y="120" width="640" height="330" rx="14" fill="#1e293b"/><circle cx="60" cy="148" r="8" fill="#f87171"/><circle cx="84" cy="148" r="8" fill="#fbbf24"/><circle cx="108" cy="148" r="8" fill="#34d399"/><text x="50" y="190" font-size="14.5" fill="#7dd3fc" font-family="'JetBrains Mono','Fira Code',Consolas,monospace">package agent.tool_gate</text><text x="50" y="216" font-size="14.5" fill="#93c5fd" font-family="'JetBrains Mono','Fira Code',Consolas,monospace"># 預設阻擋</text><text x="50" y="242" font-size="14.5" fill="#e2e8f0" font-family="'JetBrains Mono','Fira Code',Consolas,monospace">default decision := {"effect": "deny",</text><text x="50" y="266" font-size="14.5" fill="#e2e8f0" font-family="'JetBrains Mono','Fira Code',Consolas,monospace">                    "reason": "not_in_allowlist"}</text><text x="50" y="300" font-size="14.5" fill="#93c5fd" font-family="'JetBrains Mono','Fira Code',Consolas,monospace"># 同一個 admin：寄外部 domain → 升級人工核准</text><text x="50" y="326" font-size="14.5" fill="#e2e8f0" font-family="'JetBrains Mono','Fira Code',Consolas,monospace">decision := {"effect": "require_approval",</text><text x="50" y="350" font-size="14.5" fill="#e2e8f0" font-family="'JetBrains Mono','Fira Code',Consolas,monospace">             "reason": "external_egress"} if {</text><text x="50" y="374" font-size="14.5" fill="#e2e8f0" font-family="'JetBrains Mono','Fira Code',Consolas,monospace">    input.action.tool == "send_email"</text><text x="50" y="398" font-size="14.5" fill="#e2e8f0" font-family="'JetBrains Mono','Fira Code',Consolas,monospace">    not input.resource.target_domain in internal_domains</text><text x="50" y="422" font-size="14.5" fill="#e2e8f0" font-family="'JetBrains Mono','Fira Code',Consolas,monospace">}</text><rect x="710" y="120" width="380" height="190" rx="14" fill="#ffffff" stroke="#d8dee7" stroke-width="2"/><circle cx="748" cy="170" r="9" fill="#22c55e"/><text x="770" y="176" font-size="19" fill="#1e293b" font-weight="bold" text-anchor="start" font-family="'Noto Sans CJK TC','Helvetica Neue','PingFang TC','Microsoft JhengHei',Arial,sans-serif">版本控管 + PR review</text><circle cx="748" cy="230" r="9" fill="#22c55e"/><text x="770" y="236" font-size="19" fill="#1e293b" font-weight="bold" text-anchor="start" font-family="'Noto Sans CJK TC','Helvetica Neue','PingFang TC','Microsoft JhengHei',Arial,sans-serif">搭配測試</text><circle cx="748" cy="290" r="9" fill="#22c55e"/><text x="770" y="296" font-size="19" fill="#1e293b" font-weight="bold" text-anchor="start" font-family="'Noto Sans CJK TC','Helvetica Neue','PingFang TC','Microsoft JhengHei',Arial,sans-serif">稽核性</text><text x="30" y="478" font-size="12" fill="#94a3b8" text-anchor="start" font-family="'Noto Sans CJK TC','Helvetica Neue','PingFang TC','Microsoft JhengHei',Arial,sans-serif">* 示意語法，欄位對齊 repo 的 ABAC 設計，非逐字轉錄</text></svg>
